applications:
    app:
        type: nodejs:20
        web:
            commands:
                start: node server.js
            locations:
                /:
                    passthru: true

routes:
    "https://{default}/":
        type: upstream
        upstream: "app:http"
    "http://{default}/":
        type: redirect
        to: "https://{default}/"

resources:
    router:
        cpu: 0.5
        memory: 1024
